[package]
name = "text-tools"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "An example OpenRemote WASM plugin: three agent tools"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

# A small module: OpenRemote interprets it, so every byte and instruction
# saved is time saved on each call.
[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

# Its own workspace: the example builds on its own, apart from the daemon.
[workspace]
