name: Release

# Bundles the Windows, macOS and Linux installers and the signed Android
# APK, and publishes them as a GitHub Release. A manual run (Actions >
# Release > Run workflow) builds everything the same way and publishes
# nothing: the installers land as the run's own downloadable files, the
# way to check a build (the macOS one included) before a tag. The desktop jobs stage the
# daemon sidecar first - src-tauri/binaries/ is gitignored, `npm run
# daemon` regenerates it - then tauri build produces the msi, nsis and
# Linux bundles. The desktop bundles are unsigned on purpose; the release
# notes say so. The Android APK is signed with the release key held as
# repo secrets, and the job fails unless the signature verifies. The
# release job preflights the tag against the manifests, the notes file
# and the previous release's Android versionCode before building
# anything.
#
# Two channels share this one pipeline:
#
# - Stable: a `v*` tag. Its release is the newest release, so
#   `releases/latest/download/<name>` follows it and the in-app updater's
#   latest.json (written from that release) is what a stable install sees.
# - Nightly: the scheduled run. It builds whatever is on the default
#   branch and replaces the rolling `nightly` release, which is marked
#   prerelease on purpose - a nightly must never become `latest`, or the
#   stable download URLs and the updater would move to a test build. The
#   release is deleted and recreated each night so its download URLs stay
#   fixed (.../releases/download/nightly/OpenRemote-Setup-x64.exe) while
#   the binaries follow main. The previous nightly's commit is written
#   into the new notes, so the channel still reads as a history. Because
#   last night's release goes before this one is built, a night that
#   fails leaves the channel empty rather than serving a half-updated
#   build; re-running the scheduled run publishes it. Nothing in this
#   path touches the stable channel.
#
# Every published release also carries version-free names beside the
# versioned assets (OpenRemote-Setup-x64.exe, -x64.msi, -x86_64.AppImage,
# -amd64.deb, -universal.dmg, -universal.apk). A channel URL therefore
# never carries a version, and a version bump never edits a download link.
#
# Supply chain: every action below is pinned to a full commit SHA with the
# release that SHA stands for in a trailing comment, and the Rust toolchain
# to a fixed version rather than `stable`. A tag build holds
# `contents: write` and the Android signing key, so neither a re-pointed
# action tag nor a fresh stable release may change what a release compiles
# or publishes. Bump a pin deliberately: resolve the tag to its commit
# (https://api.github.com/repos/<owner>/<repo>/git/ref/tags/<tag>) and edit
# the SHA and its comment together.

on:
  push:
    tags: ['v*']
  # The nightly channel. GitHub disables a schedule after 60 days without
  # repository activity, and a re-enabled one needs a manual run first;
  # re-running a past scheduled run republishes that night.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'build-only publishes nothing; nightly publishes the rolling nightly from this branch'
        type: choice
        options: [build-only, nightly]
        default: build-only

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        # bash, not the pwsh default: the artifact globs and the ${..#v}
        # trim below are bash-isms.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The preflight below compares this tag against the previous
          # v* tag's tauri.conf.json (the versionCode check), so the
          # job needs the tags and their history, not just this tag's
          # single commit. The nightly notes read the previous nightly
          # tag out of the same history.
          fetch-depth: 0
      # One name for the release everywhere below: the pushed tag, or
      # `nightly` for the nightly channel (a scheduled run has no tag -
      # GITHUB_REF_NAME would be the branch name). Publishing is
      # `steps.ch.outputs.tag == 'nightly' || event != workflow_dispatch`
      # below: a manual run stays a build-only run unless it asked for
      # the nightly.
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      # Before anything is built: last night's release goes, tonight's
      # takes its place. The tag is deleted with it (--cleanup-tag), so
      # the release below recreates `nightly` at this run's commit; the
      # commit is captured first, for the notes.
      - name: clear the rolling nightly
        if: steps.ch.outputs.tag == 'nightly'
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "nightly^{commit}" > /dev/null; then
            git rev-parse --short "nightly^{commit}" > .nightly-previous
            echo "PREVIOUS_NIGHTLY=$(cat .nightly-previous)" >> "$GITHUB_ENV"
          fi
          # A real failure here must fail the run: carrying on would
          # upload tonight's binaries over last night's release page.
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: nightly notes
        if: steps.ch.outputs.tag == 'nightly'
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          {
            echo "# OpenRemote nightly - $(date -u +%Y-%m-%d)"
            echo
            echo "Built from \`${GITHUB_REF_NAME}\` at \`${SHA}\` on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "This is the automated nightly channel: unsigned test builds, replaced every night,"
            echo "at URLs that never change - \`https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/OpenRemote-Setup-x64.exe\`,"
            echo "and the same name for the msi, the AppImage, the deb, the dmg and the apk."
            echo "The stable channel is \`releases/latest\`. Nightlies report the stable version in-app"
            echo "(the build is not version-stamped yet) - this page's commit is the identity."
            echo
            if [ -n "${PREVIOUS_NIGHTLY:-}" ] && git cat-file -e "${PREVIOUS_NIGHTLY}^{commit}" 2>/dev/null; then
              echo "## Since the last nightly (\`${PREVIOUS_NIGHTLY}\`)"
            else
              echo "## Recent commits"
            fi
            echo
            if [ -n "${PREVIOUS_NIGHTLY:-}" ] && git cat-file -e "${PREVIOUS_NIGHTLY}^{commit}" 2>/dev/null; then
              git log --oneline --no-decorate -n 60 "${PREVIOUS_NIGHTLY}..HEAD"
            else
              git log --oneline --no-decorate -n 25 HEAD
            fi
          } > nightly-notes.md
          cat nightly-notes.md
      # Fail fast on paperwork that does not add up, before any build
      # toolchain or dependency is fetched: the tag must equal the
      # version in every manifest that carries it (a mismatch ships
      # installers whose names disagree with the release title and the
      # notes), the notes file must exist (gh release create reads it
      # only after the full build), and the Android versionCode must
      # strictly exceed the previous release's - Android refuses an
      # update install otherwise, and the only way on is uninstalling
      # the app, which wipes its private data. A nightly has no version
      # of its own to check and no notes file to require (its notes are
      # generated above); the notices and the versionCode floor are
      # checked below for both channels.
      - name: preflight (versions, notes, versionCode)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          export TAG="$GITHUB_REF_NAME"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";

            const tag = process.env.TAG;
            const ver = tag.replace(/^v/, "");
            const die = (msg) => {
              console.error(`preflight: ${msg}`);
              process.exit(1);
            };

            // The tag must equal every manifest that carries the version.
            const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
            const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const cargo = (/^version\s*=\s*"([^"]+)"/m.exec(
              readFileSync("src-tauri/Cargo.toml", "utf8"),
            ) || [])[1];
            if (pkg !== ver) die(`package.json says ${pkg}, the tag says ${ver}`);
            if (tauri.version !== ver) die(`src-tauri/tauri.conf.json says ${tauri.version}, the tag says ${ver}`);
            if (cargo !== ver) die(`src-tauri/Cargo.toml says ${cargo ?? "no version"}, the tag says ${ver}`);

            // The notes file gh release create reads must exist now,
            // not after a half hour of building.
            try {
              readFileSync(`release-notes/${tag}.md`, "utf8");
            } catch {
              die(`release-notes/${tag}.md is missing`);
            }

            // The notices ride with every artifact - the bundles read
            // them from bundle.resources, the daemon embeds them, and
            // the release lists the file itself.
            try {
              readFileSync("THIRD-PARTY_NOTICES.md", "utf8");
            } catch {
              die("THIRD-PARTY_NOTICES.md is missing");
            }

            // The Android versionCode must strictly exceed the
            // versionCode of the previous v* tag; an equal code
            // makes Android refuse the update install. A previous tag
            // that predates the Android bundle (no tauri.conf.json, or
            // no versionCode) sets no floor to exceed. Note: keep this
            // script free of single quotes - it rides inside a
            // single-quoted node -e argument.
            const code = tauri?.bundle?.android?.versionCode;
            if (code === undefined) {
              die("src-tauri/tauri.conf.json has no bundle.android.versionCode");
            }
            // The tag immediately before this one in version order;
            // for a first release there is no floor to exceed.
            const sorted = execFileSync(
              "git", ["tag", "--list", "v*", "--sort=v:refname"],
              { encoding: "utf8" },
            ).split("\n").filter((t) => t);
            const idx = sorted.indexOf(tag);
            if (idx > 0) {
              const prev = sorted[idx - 1];
              let prevCode;
              try {
                const prevConf = JSON.parse(execFileSync(
                  "git", ["show", `${prev}:src-tauri/tauri.conf.json`],
                  { encoding: "utf8" },
                ));
                prevCode = prevConf?.bundle?.android?.versionCode;
              } catch {
                // The previous tag predates the config; no floor.
              }
              if (prevCode !== undefined && !(code > prevCode)) {
                die(`Android versionCode ${code} does not exceed ${prevCode} (previous tag ${prev}); Android would refuse the update install`);
              }
            }
            console.log(`preflight: ${tag} agrees with the manifests, release-notes/${tag}.md and THIRD-PARTY_NOTICES.md exist, Android versionCode ${code} is good`);
          '
      # A tag can point at a commit no branch contains: a local commit, or
      # work on a branch that was never merged. Publishing from one would
      # ship installers built from code the project never accepted, move
      # `releases/latest` and the in-app updater for every user, and do it
      # through the pipeline that holds the release token and the Android
      # signing key. The compare API answers whether this commit is on the
      # default branch's history: identical or behind is fine (a
      # maintenance tag on an older commit), ahead or diverged is not.
      - name: preflight (the tag is on the default branch)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          default="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${default}...${sha}" --jq .status)"
          case "$status" in
            identical|behind)
              echo "preflight: ${GITHUB_REF_NAME} is on ${default} (compare status: ${status})"
              ;;
            *)
              echo "preflight: ${GITHUB_REF_NAME} points at ${sha}, which is not on ${default} (compare status: ${status}); merge it into ${default} and tag that commit instead" >&2
              exit 1
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
      # The nightly keeps the same applicationId and versionCode as the
      # stable APK, so the two install over each other in either
      # direction (same signature, same code). The versionCode floor
      # still holds for stable tags, where the next release must
      # strictly exceed the tag before it - see the preflight above.
      # Fixed at 1.99.1 rather than `stable` (every job here, and ci.yml,
      # does the same): a moving stable would let a re-pushed tag compile
      # with a different rustc than the build it replaces, and with it a
      # differently linked glibc-pinned daemon asset. 1.99.1 is the stable
      # the workspace is built and tested with today, and it sits above the
      # daemon's declared MSRV of 1.85 (the MSRV job in ci.yml checks that
      # floor separately).
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            src-tauri
      # A re-pushed tag whose release already carries THIS version's
      # desktop bundles skips the rebuild; the bundles are already
      # there. The gate matches the exact asset names this tag's
      # version implies, not an asset count: any other mix of assets
      # (a partial upload, a release created with only its notes) runs
      # the Windows build, so a re-pushed tag never leaves a release
      # missing the msi or the nsis. The nightly never skips: its
      # release was just deleted, and its assets must follow main.
      - name: a rebuild, or a re-run
        id: build
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if [ -n "$assets" ] \
            && grep -qxF "OpenRemote_${ver}_x64_en-US.msi" <<< "$assets" \
            && grep -qxF "OpenRemote_${ver}_x64-setup.exe" <<< "$assets"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.build.outputs.skip != '1'
      # The console's own tests, before half an hour of building. A tag can
      # be pushed straight at the default branch without that commit ever
      # going through a pull request, so this is the only place the suite
      # runs on exactly what is being shipped.
      - run: npm test
        if: steps.build.outputs.skip != '1'
      - run: OR_RELEASE=1 node scripts/sync-daemon.mjs
        if: steps.build.outputs.skip != '1'
      - run: npx tauri build
        if: steps.build.outputs.skip != '1'
      # Tauri embeds the version in the artifact names
      # (OpenRemote_0.1.0_x64_en-US.msi, OpenRemote_0.1.0_x64-setup.exe),
      # so the globs stay version-proof.
      # Create on the first run; a tag that already has a release (a
      # re-pushed tag) uploads over the existing assets instead. A skipped
      # rebuild has nothing new to upload. Each bundle is uploaded twice:
      # under its versioned name and under the channel's version-free one,
      # so `/releases/latest/download/OpenRemote-Setup-x64.exe` (stable)
      # and `/releases/download/nightly/OpenRemote-Setup-x64.exe`
      # (nightly) never change with a version bump.
      - name: publish the Windows installers
        if: (steps.ch.outputs.tag == 'nightly' || github.event_name != 'workflow_dispatch') && steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          cp src-tauri/target/release/bundle/nsis/*.exe OpenRemote-Setup-x64.exe
          cp src-tauri/target/release/bundle/msi/*.msi OpenRemote-Setup-x64.msi
          assets=(
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            OpenRemote-Setup-x64.msi
            OpenRemote-Setup-x64.exe
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
          elif [ "$TAG" = "nightly" ]; then
            gh release create nightly "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "OpenRemote nightly - $(date -u +%Y-%m-%d)" \
              --notes-file nightly-notes.md
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "OpenRemote ${TAG#v}" \
              --notes-file "release-notes/${TAG}.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            src-tauri
      # Tauri's Linux build dependencies (webkit2gtk 4.1 era).
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # The machine installer downloads a standalone daemon from the
      # release (openremote-daemon-linux-x86_64, checked against
      # SHA256SUMS). A plain runner build links a glibc newer than old
      # servers have, so the asset is cross-built pinned to glibc 2.28 -
      # the floor the daemon deploys are built to.
      - name: zig for the glibc-pinned daemon
        run: |
          set -euo pipefail
          ZIG=0.14.1
          # ziglang.org's download index publishes this checksum for
          # zig-x86_64-linux-0.14.1.tar.xz; verified against the index
          # at https://ziglang.org/download/index.json. A wrong or
          # tampered tarball must fail here, not inside a build.
          ZIG_SHA256=24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG}/zig-x86_64-linux-${ZIG}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum --check --strict -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG}" >> "$GITHUB_PATH"
          # Pinned so a new cargo-zigbuild release cannot change what a
          # tag build links against; bump deliberately, not by drift.
          cargo install --locked cargo-zigbuild --version 0.23.4
      - run: npm ci
      - run: OR_RELEASE=1 node scripts/sync-daemon.mjs
      # The config's bundle targets are the Windows formats; the CLI
      # flag picks the Linux ones for this runner.
      - run: npx tauri build --bundles appimage,deb
      # The version-free names ride beside the versioned ones, the way
      # the Windows job uploads them.
      - name: publish the Linux installers
        if: steps.ch.outputs.tag == 'nightly' || github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          cp src-tauri/target/release/bundle/appimage/*.AppImage OpenRemote-x86_64.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb OpenRemote-amd64.deb
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            OpenRemote-x86_64.AppImage \
            OpenRemote-amd64.deb
        env:
          GH_TOKEN: ${{ github.token }}
      # The machine installer's download: the daemon alone, named as
      # install.sh expects, with the checksum file it verifies against.
      # The plain triple's artifacts are the sidecar's; the glibc-pinned
      # build lands under its own target dir. The notices ride beside
      # the binary - the daemon also embeds them, but the release page
      # and a plain download carry the readable file.
      - name: the daemon asset
        run: |
          set -euo pipefail
          ( cd daemon && cargo zigbuild -p openremote-daemon --locked --release --target x86_64-unknown-linux-gnu.2.28 )
          cp daemon/target/x86_64-unknown-linux-gnu/release/openremote-daemon openremote-daemon-linux-x86_64
          sha256sum openremote-daemon-linux-x86_64 THIRD-PARTY_NOTICES.md > SHA256SUMS
      - if: steps.ch.outputs.tag == 'nightly' || github.event_name != 'workflow_dispatch'
        run: gh release upload "$TAG" openremote-daemon-linux-x86_64 THIRD-PARTY_NOTICES.md SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            openremote-daemon-linux-x86_64
            SHA256SUMS

  android:
    # The phone. The daemon rides inside the APK as a library, so the
    # sidecar staging the desktop jobs do is not needed - but tauri's
    # config still lists the sidecar and the CLI resolves it, so stage
    # one anyway. Gradle drives cargo back through the tauri CLI once
    # per ABI; the default is all four, into one universal APK.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      # Gradle 9 / AGP 9 want JDK 17 at least; 21 is the LTS in play.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            src-tauri
      # The runner image ships the SDK with the 37.0 platform (the
      # minor-version scheme - there is no bare android-37 package) and
      # build-tools preinstalled; setup-android's own update pass dies
      # on Google's retirement of the legacy 'tools' package, so the SDK
      # is used as it ships. Licenses are accepted so AGP can fetch
      # anything the image lacks, and the 37.0 install is a no-op when
      # the platform is already there. The tauri CLI locates the NDK
      # through NDK_HOME (cargo-mobile2's contract, the same one
      # scripts/android-env.sh uses), and AGP finds the SDK through
      # local.properties.
      - name: point the build at the SDK and its NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          # yes feeds every license prompt, then dies on SIGPIPE; its
          # exit must not fail the step - only sdkmanager's own rc.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-37.0"
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)"
          test -n "$NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src-tauri/gen/android/local.properties
      # A re-pushed tag whose release already carries THIS version's APK
      # skips the rebuild; the APK is already there. The gate matches the
      # exact name this tag's version implies (the upload step
      # below names the file the same way), not just any APK - a
      # re-pushed tag must not keep a previous commit's build. The
      # nightly never skips: its release was just deleted.
      - name: a rebuild, or a re-run
        id: build
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -qxF "OpenRemote_${TAG#v}_universal.apk" <<< "$assets"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.build.outputs.skip != '1'
      - run: node scripts/sync-daemon.mjs
        if: steps.build.outputs.skip != '1'
      # keystore.properties names the key for the gradle build
      # (gitignored); the store path is relative to the app module.
      - name: stage the release signing key
        if: steps.build.outputs.skip != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/openremote-release.keystore.p12
          printf 'storeFile=openremote-release.keystore.p12\npassword=%s\nkeyAlias=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_ALIAS" > src-tauri/gen/android/keystore.properties
      - run: npx tauri android build --apk
        if: steps.build.outputs.skip != '1'
      # The signature is part of the release contract: the job fails if
      # the APK does not verify, and the log carries the signer cert.
      # AGP signs in the assemble when the release signing config is
      # wired; the -unsigned sibling is the intermediate.
      - name: verify the signature
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name 'app-universal-*.apk' ! -name '*unsigned*' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
          test -n "$APK"
          echo "APK: $APK"
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -n 12
          cp "$APK" "OpenRemote_${TAG#v}_universal.apk"
          cp "$APK" OpenRemote-universal.apk
      - name: publish the APK
        if: (steps.ch.outputs.tag == 'nightly' || github.event_name != 'workflow_dispatch') && steps.build.outputs.skip != '1'
        run: gh release upload "$TAG" "OpenRemote_${TAG#v}_universal.apk" OpenRemote-universal.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: OpenRemote_*_universal.apk

  macos:
    # One universal .dmg for Apple silicon and Intel. The daemon is built
    # for both and merged with lipo into the universal sidecar tauri
    # expects. The app is ad-hoc signed - there is no Apple developer
    # account - so the release notes carry the first-open steps. With no
    # Mac to click through it, the bundle check is the proof: the job
    # fails unless the app and its sidecar carry both architectures and
    # the ad-hoc signature verifies.
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            src-tauri
      # A re-pushed tag whose release already carries this version's dmg
      # skips the rebuild - the same gate the other jobs use. The nightly
      # never skips.
      - name: a rebuild, or a re-run
        id: build
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -qxF "OpenRemote_${TAG#v}_universal.dmg" <<< "$assets"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.build.outputs.skip != '1'
      - name: the universal daemon sidecar
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          ( cd daemon \
            && cargo build -p openremote-daemon --locked --release --target aarch64-apple-darwin \
            && cargo build -p openremote-daemon --locked --release --target x86_64-apple-darwin )
          mkdir -p src-tauri/binaries
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cp "daemon/target/$t/release/openremote-daemon" "src-tauri/binaries/openremote-daemon-$t"
          done
          lipo -create -output src-tauri/binaries/openremote-daemon-universal-apple-darwin \
            src-tauri/binaries/openremote-daemon-aarch64-apple-darwin \
            src-tauri/binaries/openremote-daemon-x86_64-apple-darwin
          lipo -info src-tauri/binaries/openremote-daemon-universal-apple-darwin
      # The .app as its own bundle too, not only inside the dmg: the check
      # below inspects it.
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        if: steps.build.outputs.skip != '1'
      - name: check the bundle
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          ls -la "$BUNDLE" "$BUNDLE"/* || true
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$APP"
          test -n "$DMG"
          for bin in "$APP"/Contents/MacOS/*; do
            info="$(lipo -info "$bin")"
            echo "$info"
            grep -q x86_64 <<< "$info"
            grep -q arm64 <<< "$info"
          done
          codesign -dv "$APP" 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt
          codesign --verify --deep --strict "$APP"
          ls -la "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      - if: (steps.ch.outputs.tag == 'nightly' || github.event_name != 'workflow_dispatch') && steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          cp "$DMG" OpenRemote-universal.dmg
          gh release upload "$TAG" "$DMG" OpenRemote-universal.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: ${{ env.DMG }}
